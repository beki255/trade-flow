services:
  # 1. PostgreSQL with PostGIS extension (Geospatial Corridor Database)
  postgres:
    image: postgis/postgis:16-3.4
    container_name: tradeflow_postgres
    restart: always
    environment:
      POSTGRES_USER: tradeflow_user
      POSTGRES_PASSWORD: tradeflow_password
      POSTGRES_DB: tradeflow_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tradeflow_user -d tradeflow_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Redis (In-Memory Fast Cache & Telematics Stream Queue)
  redis:
    image: redis:7.2-alpine
    container_name: tradeflow_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 3. MinIO (S3-Compatible Document & Media Storage for Customs Invoices & POD)
  minio:
    image: minio/minio:RELEASE.2024-05-10T01-41-38Z
    container_name: tradeflow_minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: tradeflow_admin
      MINIO_ROOT_PASSWORD: tradeflow_storage_pass
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # Web Console
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 4. Adminer (Visual Database Management Web UI like phpMyAdmin/pgAdmin)
  adminer:
    image: adminer:4.8.1-standalone
    container_name: tradeflow_adminer
    restart: always
    ports:
      - "8080:8080"
    depends_on:
      - postgres

volumes:
  postgres_data:
  redis_data:
  minio_data:
